    compile files('libs/gdata-sites-meta-2.0.jar')
    compile files('libs/gdata-spreadsheet-3.0.jar')
    compile files('libs/gdata-spreadsheet-meta-3.0.jar')
    compile files('libs/gdata-webmastertools-2.0.jar')
    compile files('libs/gdata-webmastertools-meta-2.0.jar')
    compile files('libs/gdata-youtube-2.0.jar')
    compile files('libs/gdata-youtube-meta-2.0.jar')
    implementation files('libs/gson-2.2.4.jar')
    implementation files('libs/guava-11.0.2.jar')
    implementation files('libs/httpmime-4.1.1.jar')
    implementation files('libs/jsr305.jar')
